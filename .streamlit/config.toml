# Tema Soft Investing (design system "Soft Glass", artifact NFSg6TDRqqdXEJp3C7hGTx): ardesia scura, accento menta
[theme]
base = "dark"
primaryColor = "#5EEAD4"
backgroundColor = "#0F1720"
secondaryBackgroundColor = "#172330"
codeBackgroundColor = "#172330"
textColor = "#EAF2F5"
linkColor = "#5EEAD4"
borderColor = "#25384A"
codeTextColor = "#EAF2F5"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "18px"
buttonRadius = "12px"

font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap"
headingFont = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap"
codeFont = "'DM Mono':https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [800, 800, 600, 600, 600, 600]
linkUnderline = false

greenColor = "#7BE0A4"
redColor = "#FF9DA7"
yellowColor = "#FFC878"
orangeColor = "#FFA86B"
blueColor = "#8AB4FF"
violetColor = "#C4A8FF"
grayColor = "#8FA6B2"

chartCategoricalColors = ["#5EEAD4", "#8AB4FF", "#FFC878", "#FF9DA7", "#7BE0A4", "#C4A8FF", "#8FA6B2"]

dataframeBorderColor = "#25384A"
dataframeHeaderBackgroundColor = "#172330"

[theme.sidebar]
backgroundColor = "#0F1720"
secondaryBackgroundColor = "#172330"
codeBackgroundColor = "#172330"
textColor = "#EAF2F5"
borderColor = "#25384A"
primaryColor = "#5EEAD4"
