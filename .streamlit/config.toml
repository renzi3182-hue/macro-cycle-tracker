# Tema scuro "quiet terminal": fondo blu-nero, card #111827, numeri in monospace (redesign 2026-09)
[theme]
base = "dark"
primaryColor = "#60A5FA"
backgroundColor = "#0B0F17"
secondaryBackgroundColor = "#111827"
codeBackgroundColor = "#111827"
textColor = "#E6EAF2"
linkColor = "#60A5FA"
borderColor = "#1E2738"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "8px"

font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#9AA6B8"

chartCategoricalColors = ["#60A5FA", "#34D399", "#A78BFA", "#F87171", "#FBBF24", "#38BDF8", "#94A3B8"]

dataframeBorderColor = "#1E2738"
dataframeHeaderBackgroundColor = "#111827"

[theme.sidebar]
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111827"
codeBackgroundColor = "#111827"
textColor = "#E6EAF2"
borderColor = "#1E2738"
primaryColor = "#60A5FA"
