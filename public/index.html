        integrity="sha384-OK7vELvjHdhUFi31JYioPIcRHTROLdcDa6ZsNWgvgLaKj+9JqhU0Ad8g4wz3CXjA" crossorigin="anonymous"></script>

<style>
/* Token del design system Soft Glass: stessi valori di src/ui/theme.py. I blocchi .si arrivano con il loro CSS in site.json. */
:root {
  --bg: #0F1720; --surface: #172330; --raised: #1E2D3D; --fg: #EAF2F5; --muted: #8FA6B2; --line: #25384A;
  --accent: #5EEAD4; --on-accent: #062B26; --r-gold: #7BE0A4; --r-defl: #8AB4FF; --r-refl: #FFC878; --r-stag: #FF9DA7;
  --shadow: 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #F3F8F8; --surface: #FFFFFF; --raised: #E6F0F1; --fg: #0F1720; --muted: #4F6472; --line: #D3E2E6;
    --accent: #0A7F70; --on-accent: #FFFFFF; --r-gold: #177A4D; --r-defl: #2F6DB5; --r-refl: #8F5A05; --r-stag: #C0394B;
    --shadow: 0 4px 16px rgba(15,23,32,.08); color-scheme: light;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; }
a { color: var(--accent); }
main { max-width: 1240px; margin: 0 auto; padding: 0 16px 96px; }
main > * + *, #page > * + *, [data-when] > * + *, .cols > div > * + * { margin-top: 16px; }
.hidden, [data-when].off { display: none !important; }

header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line); }
header .in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
header .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.03em; font-size: 17px; color: var(--fg); text-decoration: none; flex: none; }
header .brand img { width: 30px; height: 30px; }
@media (max-width: 520px) { header .brand span { display: none; } header .in { gap: 8px; padding: 10px 12px; } nav { gap: 0; } nav a { padding: 8px 6px; font-size: 14px; } }
nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; align-items: center; }
nav a, nav summary { color: var(--muted); text-decoration: none; padding: 8px 12px; border-radius: 10px; white-space: nowrap; font-weight: 500; cursor: pointer; }
nav a:hover, nav summary:hover { color: var(--fg); background: var(--raised); }
nav a.on { color: var(--fg); background: var(--raised); font-weight: 600; }
nav details { position: relative; }
nav summary { list-style: none; }
nav summary::-webkit-details-marker { display: none; }
nav details[open] summary, nav details.on summary { color: var(--fg); }
#sectionNav { display:flex; flex-wrap:wrap; gap:4px; margin:16px 0; }
#sectionNav:empty { display:none; }
#nav .planned-tab { padding:8px 12px;color:var(--muted);white-space:nowrap;font-size:inherit; }
#nav:has(.planned-tab) { scrollbar-width:thin; }
html[data-overview-theme] #page {margin-top:18px}
#sectionNav a { color:var(--muted); text-decoration:none; padding:6px 10px; border-radius:8px; }
#sectionNav a[aria-current], #sectionNav a:hover { background:var(--raised); color:var(--fg); }
.fresh { font-size: 13px; color: var(--muted); margin-top: 12px; }
.fresh i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 2px; max-width: 100%; }
.seg button { font: inherit; border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; white-space: nowrap; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--raised); color: var(--fg); font-weight: 500; }
.seg.multi button.on { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--fg); }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; width: fit-content; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.lbl { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
.cols { display: grid; gap: 16px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr) !important; } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.box > * + * { margin-top: 12px; }
.prose p, .prose ul { margin: 0 0 10px; } .prose ul { padding-left: 20px; } .prose h3, h3.h { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
.prose code { font-family: "DM Mono", monospace; font-size: 13px; }
.cap { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.cap b { color: var(--fg); font-weight: 600; }
.notice { margin: 12px 0 0; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); border-left: 3px solid var(--accent);
  background: var(--surface); font-size: 14px; }
.notice.warn { border-left-color: var(--r-refl); }
.notice details { margin-top: 4px; font-size: 13px; color: var(--muted); }
.notice summary { cursor: pointer; }
details.box summary { cursor: pointer; font-weight: 600; }
pre.copy { white-space: pre-wrap; font: 13px/1.5 "DM Mono", monospace; background: var(--raised); padding: 12px; border-radius: 12px; }
.metrics { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.metric { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.metric .k { font-size: 13px; color: var(--muted); }
.metric .v { font: 500 26px/1.2 "DM Mono", monospace; font-variant-numeric: tabular-nums; }
.metric .d { font-size: 13px; }
.metric .spark { width: 100%; height: 34px; margin-top: 6px; }
.lwc { height: 300px; margin-top: 8px; }
.loading { color: var(--muted); padding: 40px 0; }

/* Preparazione del colloquio */
.advice h1 { font-size: clamp(30px, 5vw, 52px); line-height: 1.12; font-weight: 800; letter-spacing: -.03em; margin: 0; }
.advice h2 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
.advice p { margin-bottom: 0; }
.advice .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.advice .metrics { margin-top: 12px; }
.advice .metric .v { font: 600 16px/1.4 "Plus Jakarta Sans", system-ui, sans-serif; }
.advice a { text-underline-offset: 3px; }

.advice-fields { display: flex; flex-wrap: wrap; gap: 10px; }
.advice-fields label, .advice-position label { display: grid; gap: 3px; min-width: 0; font-size: 13px; color: var(--muted); }
.advice input:not([type=checkbox]), .advice select {
  width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--raised); color: var(--fg); font: inherit;
}
.advice-position { margin: 0 0 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
  display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.advice-position .advice-reference { grid-column: 1 / -1; }
.advice-position .toggle { display: flex; }
.advice-position .btn { grid-column: 2; justify-self: end; }
.advice button[hidden], .advice [hidden] { display: none; }
.advice-plot { width: 100%; height: auto; display: block; margin-top: 16px; }
/* reveal() nasconde i blocchi fuori vista finche' non ci si scorre sopra: in stampa vanno mostrati tutti */
@media print { #page .card, #page .box, #page .metric, .advice-plot .mc-data { opacity: 1 !important; transform: none !important; clip-path: none !important; } }
.advice-key { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; }
.advice-key span::before { content: ""; display: inline-block; width: 16px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--key); }

/* stress test: posizioni modificabili */
.edit { width: 100%; border-collapse: collapse; font-size: 14px; }
.edit th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px; }
.edit td { padding: 3px 4px; border-top: 1px solid var(--line); }
.edit select, .edit input { font: inherit; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
.edit input { font-family: "DM Mono", monospace; text-align: right; width: 84px; }
.edit button, .btn { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.edit button:hover, .btn:hover { color: var(--fg); }
</style>

<body>
<header><div class="in">
  <a class="brand" href="/" data-link><img id="logo" src="/logo-mark.svg" alt=""> <span>Soft Investing</span></a>
  <nav id="nav"></nav>
</div></header>
<main>
  <div class="fresh"><span id="fresh"></span></div>
  <div id="warnings"></div>
  <nav id="sectionNav" aria-label="Viste della sezione"></nav>
  <div id="page"><p class="loading">Carico i dati…</p></div>
</main>

<script src="/workbench.js?v=chart-axes-2"></script>
<script src="/overview.js"></script>
<template id="advice">
  <section class="advice">
    <div class="box">
      <p class="lbl">Macro Cycle Tracker</p>
      <h1>Patrimonio e proposta</h1>
      <p>Inserisci le posizioni in euro e prova una modifica. I dati restano in memoria nella scheda del browser.</p>
    </div>

    <div class="box">
      <h2>Obiettivo di spesa</h2>
      <div class="advice-fields">
        <label>Importo in euro <input id="advice-goal" type="number" min="0" max="1000000000000" step=".01"></label>
        <label>Mese previsto <input id="advice-date" type="month"></label>
      </div>
      <p class="cap">Segna come disponibili solo le posizioni che il cliente potrebbe liquidare entro quel mese. La stima assume che il ricavato sia disponibile al valore simulato.</p>
    </div>

    <div class="cols">
      <div class="box">
        <h2>Situazione attuale</h2>
        <div id="advice-current"></div>
        <p class="cap" id="advice-total-current"></p>
        <button type="button" class="btn" id="advice-add-current">Aggiungi posizione</button>
      </div>
      <div class="box">
        <h2>Proposta</h2>
        <p id="advice-empty">Copia la situazione attuale e modifica la distribuzione a parità di capitale.</p>
        <div id="advice-proposed" hidden></div>
        <p class="cap" id="advice-total-proposed"></p>
        <div class="advice-fields">
          <button type="button" class="btn" id="advice-copy">Copia la situazione attuale</button>
          <button type="button" class="btn" id="advice-add-proposed" hidden>Aggiungi posizione</button>
          <button type="button" class="btn" id="advice-reset" hidden>Elimina la proposta</button>
        </div>
      </div>
    </div>

    <div class="box">
      <h2>Confronto</h2>
      <button type="button" class="btn" id="advice-run">Calcola il confronto</button>
      <div id="advice-result" aria-live="polite"></div>
      <p class="cap">Scheda di preparazione. La proposta richiede una valutazione di adeguatezza.</p>
    </div>

    <details class="box">
      <summary>Contesto di mercato</summary>
      <div id="advice-market"></div>
      <p><a href="/mondo">Apri la panoramica mondiale</a></p>
    </details>
  </section>
</template>
<script>
"use strict";
const MAIN = [["panoramica","Panoramica"], ["strumento","Catalogo"], ...(privateMode() ? [["clienti","Clienti"]] : []), ["consulenza","Consulenza"]];
const sections = {
  panoramica: [["", "Overview"], ["oggi", "Oggi"], ["mondo", "Mondo"], ["paese", "Paese"], ["calendario", "Calendario"]],
  strumento: [["", "Elenco strumenti"], ["asset", "Classifica asset"]],
  consulenza: [["", "Colloquio"], ["allocazione", "Allocazione"], ["portafoglio", "Portafoglio e stress test"]]
};
const legacy = { metodo:"paese", mercati:"panoramica", cot:"strumento", aree:"paese", classifica:"asset", valute:"allocazione" };
// /paese/italia -> /paese?area=Italia: sigle corte maiuscole (USA, UK), il resto con l'iniziale maiuscola
const areaFromSlug = s => s.length <= 3 ? s.toUpperCase() : s[0].toUpperCase() + s.slice(1).toLowerCase();
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
let DATA = null;
const filters = {};  // filtri del calendario, solo per questa visita (come in Streamlit)

const dark = matchMedia("(prefers-color-scheme: dark)");
const token = name => getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
function setLogo() { $("#logo").src = (document.documentElement.dataset.overviewTheme || (dark.matches ? "dark" : "light")) === "dark" ? "/logo-mark.svg" : "/logo-mark-light.svg"; }

// Movimento (Motion, motion.dev): solo se la libreria e' caricata e senza prefers-reduced-motion, altrimenti niente
const still = matchMedia("(prefers-reduced-motion: reduce)");
const motion = () => !still.matches && window.Motion;
const EASE = [0.22, 1, 0.36, 1];
// Ogni blocco della pagina compare quando entra nello schermo, una volta sola (prima si animavano anche quelli fuori vista)
function reveal(page) {
  const M = motion();
  if (!M) return;
  const blocks = $$(".card, .box, .metric", page).filter(el => !el.parentElement.closest(".card, .box, .metric"));
  blocks.forEach(el => { el.style.opacity = 0; });
  M.inView(blocks, el => { M.animate(el, { opacity: [0, 1], y: [8, 0] }, { duration: 0.4, ease: EASE }); }, { margin: "0px 0px -40px 0px" });
}
// Grafico Monte Carlo: fasce e mediane si scoprono da oggi verso il futuro
function drawPlot(root) {
  const M = motion(), g = $(".advice-plot .mc-data", root);
  if (!M || !g) return;
  M.animate(g, { clipPath: ["inset(0 100% 0 0)", "inset(0 0% 0 0)"] }, { duration: 1.1, ease: EASE });
}

function params() { return new URLSearchParams(location.search); }

function currentView() {
  const path = location.pathname.replace(/^\/|\/$/g, "");
  const query = params();
  let key = legacy[path] || path || "panoramica";
  if (path.startsWith("paese/")) {
    key = "paese";
    query.set("area", areaFromSlug(decodeURIComponent(path.slice(6))));
  }
  const parent = Object.keys(sections).find(section => sections[section].some(([view]) => view === key));
  const section = parent || (MAIN.some(([k]) => k === key) ? key : "panoramica");
  if (parent) query.set("vista", key);
  const view = (sections[section] || []).find(([v]) => v === query.get("vista"))?.[0] || "";
  if (path && path !== section) {
    history.replaceState(null, "", "/" + section + (query.size ? "?" + query : "") + location.hash);
  }
  return {section, view};
}

const panoramaTabs = [
  ["", "Overview"], [null, "Macro Monitor"], [null, "Market Monitor"],
  [null, "Economic Outlook"], [null, "Portfolio Strategy"], ["calendario", "Calendar & News"]
];

function renderNav(section, view) {
  if (section === "panoramica" && panoramaTabs.some(([key]) => key === view)) {
    $("#nav").innerHTML = panoramaTabs.map(([key,label]) => key === null
      ? `<span class="planned-tab" aria-disabled="true" title="Scheda in progettazione">${label}</span>`
      : `<a href="/panoramica${key ? "?vista=" + key : ""}" ${key === view ? 'aria-current="page" class="on"' : ""}>${label}</a>`).join("");
    $("#sectionNav").replaceChildren();
    return;
  }
  $("#nav").innerHTML = MAIN.map(([k,t]) => `<a href="/${k}" class="${k === section ? "on" : ""}">${t}</a>`).join("");
  $("#sectionNav").innerHTML = (sections[section] || []).map(([k,t]) =>
    `<a href="/${section}${k ? "?vista=" + k : ""}" ${k === view ? 'aria-current="page"' : ""}>${t}</a>`).join("");
}

function go(url, replace = false) {
  history[replace ? "replaceState" : "pushState"](null, "", url);
  route();
}

document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  if (!a || a.hasAttribute("download") || a.target === "_blank" || e.metaKey || e.ctrlKey) return;
  const href = a.getAttribute("href");
  if (href.startsWith("#")) return;  // ancora nella pagina (es. #cosa-vuol-dire)
  const url = new URL(href, location.origin + "/");
  if (url.origin !== location.origin) return;
  e.preventDefault();
  go(url.pathname + url.search);
  scrollTo(0, 0);
});
addEventListener("popstate", route);

// --- varianti: blocchi data-when="nome=valore;nome=valore", scelte nei .seg[data-switch] e checkbox[data-switch] ---
function state(page) {
  const p = params(), s = {};
  $$("[data-switch]", page).forEach(el => {
    const name = el.dataset.switch;
    if (el.type === "checkbox") s[name] = p.get(name) === "1" && !el.disabled ? "1" : "0";
    else {
      const ok = [...el.querySelectorAll("button")].map(b => b.dataset.value);
      s[name] = ok.includes(p.get(name)) ? p.get(name) : el.dataset.default;  // valore sconosciuto nell'URL: predefinito
    }
  });
  return s;
}

function applyState(page) {
  const s = state(page);
  $$("[data-switch]", page).forEach(el => {
    if (el.type === "checkbox") el.checked = s[el.dataset.switch] === "1";
    else el.querySelectorAll("button").forEach(b => {
      const active = b.dataset.value === s[el.dataset.switch];
      b.classList.toggle("on", active);
      b.setAttribute("aria-pressed", active);
    });
  });
  $$("[data-when]", page).forEach(el => {
    const ok = el.dataset.when.split(";").every(c => { const [k, v] = c.split("="); return s[k] === v; });
    el.classList.toggle("off", !ok);
  });
  drawCharts(page);
  if ($("#lab", page)) lab.update(s);
}

function setParam(name, value) {
  const p = params();
  p.set(name, value);
  history.replaceState(null, "", location.pathname + "?" + p);
  applyState($("#page"));
}

document.addEventListener("click", e => {
  const b = e.target.closest(".seg button");
  if (!b) return;
  const seg = b.parentElement;
  if (seg.dataset.switch) setParam(seg.dataset.switch, b.dataset.value);
  if (seg.dataset.filter) {
    const set = filters[seg.dataset.filter];
    set.has(b.dataset.value) ? set.delete(b.dataset.value) : set.add(b.dataset.value);
    applyFilters($("#page"));
  }
});
document.addEventListener("change", e => {
  if (e.target.matches("input[type=checkbox][data-switch]")) setParam(e.target.dataset.switch, e.target.checked ? "1" : "0");
});
// i grafici dentro un <details> chiuso non hanno larghezza: si disegnano quando si apre
document.addEventListener("toggle", e => { if (e.target.open) drawCharts(e.target); }, true);

// --- calendario: scelta multipla di valute e impatto sulle righe di calendar_html ---
function applyFilters(page) {
  $$(".seg[data-filter]", page).forEach(seg => {
    const name = seg.dataset.filter;
    filters[name] ??= new Set(seg.dataset.default.split(",").filter(Boolean));
    seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", filters[name].has(b.dataset.value)));
  });
  const cal = $("#calendar", page);
  if (!cal) return;
  let shown = 0;
  $$(".row", cal).forEach(r => {
    const ok = filters.ccy.has(r.dataset.ccy) && filters.impact.has(r.dataset.impact);
    r.classList.toggle("hidden", !ok);
    shown += ok;
  });
  $$("h4", cal).forEach(h => {  // giorno senza righe visibili: via anche il titolo
    let n = h.nextElementSibling, any = false;
    while (n && n.tagName !== "H4") { any ||= !n.classList.contains("hidden"); n = n.nextElementSibling; }
    h.classList.toggle("hidden", !any);
  });
  let empty = $(".empty", cal);
  if (!empty) { empty = document.createElement("p"); empty.className = "note empty"; empty.textContent = "Nessun evento con questi filtri."; $(".list", cal).append(empty); }
  empty.classList.toggle("hidden", shown > 0);
}

// --- grafici (Lightweight Charts, come renderLightweightCharts nell'app) ---
function lineChart(el, spec) {
  el.innerHTML = "";
  el.style.height = (spec.height || 300) + "px";
  const chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { type: "solid", color: "transparent" }, textColor: token("muted"), fontFamily: "DM Mono, monospace" },
    grid: { vertLines: { visible: false }, horzLines: { color: token("line") } },
    rightPriceScale: { visible: true, borderVisible: false }, leftPriceScale: { visible: false, borderVisible: false },
    timeScale: { borderVisible: false, rightOffset: 6 }, crosshair: { mode: 0 },
  });
  for (const s of spec.series) {
    const color = token(s.tok);
    const opt = { lineWidth: 2, priceLineVisible: false, lastValueVisible: true };
    const ser = s.type === "area"
      ? chart.addAreaSeries({ ...opt, lineColor: color, topColor: color + "40", bottomColor: color + "08" })
      : chart.addLineSeries({ ...opt, color });
    ser.setData(s.data.map(([time, value]) => ({ time, value })));
    for (const l of spec.lines || [])
      ser.createPriceLine({ price: l.value, color: token(l.tok), lineWidth: 1, lineStyle: l.title ? 2 : 0, axisLabelVisible: !!l.title, title: l.title });
  }
  chart.timeScale().fitContent();
}

function drawCharts(page) {
  $$("[data-chart]", page).forEach(el => {

// --- stress test del Portafoglio: src/classify/stress.py rifatto nel browser ---
const MONTHS = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
const monthIt = (ym, short = false) => { const [y, m] = ym.split("-"); const n = MONTHS[+m - 1]; return `${short ? n.slice(0, 3) : n} ${y}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#x27;" }[c]));
const signed = (x, d = 0) => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(d).replace(".", ",");
const pctIt = (x, d = 0) => signed(x * 100, d) + "%";
const money = v => Math.round(v).toLocaleString("en-US").replace(/,/g, ".");
const monthsIt = n => n === null ? "non ancora" : n === 0 ? "subito" : `${n} ${n === 1 ? "mese" : "mesi"}`;

const stress = {
  tickerWeights(weights, proxy) {
    const out = {}, skipped = [];
    for (const [asset, w] of Object.entries(weights)) {
      if (!(w > 0)) continue;
      if (proxy[asset]) out[proxy[asset]] = (out[proxy[asset]] || 0) + w; else skipped.push(asset);
    }
    const tot = Object.values(out).reduce((a, b) => a + b, 0);
    for (const t in out) out[t] /= tot;
    return [tot ? out : {}, skipped];
  },
  ret(p) { return p.map((v, i) => i && v !== null && p[i - 1] !== null ? v / p[i - 1] - 1 : null); },
  combine(tw, cols) {  // somma pesata, null se manca anche un solo ETF
    const n = cols[0].length;
    return Array.from({ length: n }, (_, i) => {
      let s = 0;
      for (let j = 0; j < cols.length; j++) { if (cols[j][i] === null) return null; s += tw[j] * cols[j][i]; }
      return s;
    });
  },
  portfolio(tw, S) { const t = Object.keys(tw); return this.combine(t.map(k => tw[k]), t.map(k => this.ret(S.px[k]))); },
  trend(tw, S) {  // sotto la media a N mesi a fine mese: in cash (BIL) il mese dopo
    const t = Object.keys(tw), N = S.trend_months, cash = this.ret(S.px[S.cash]);
    const cols = t.map(k => {
      const p = S.px[k], r = this.ret(p);
      return p.map((_, i) => {
        if (i < N) return null;
        let s = 0;
        for (let j = i - N; j < i; j++) { if (p[j] === null) return null; s += p[j]; }
        return p[i - 1] > s / N ? r[i] : cash[i];
      });
    });
    return this.combine(t.map(k => tw[k]), cols);
  },
  eur(r, fx) { return r.map((v, i) => v === null || !i || fx[i] === null || fx[i - 1] === null ? null : (1 + v) * fx[i - 1] / fx[i] - 1); },
  commonWindow(...series) {  // indici dell'ultimo tratto consecutivo in cui tutte le serie hanno un valore
    const ok = series[0].map((_, i) => series.every(s => s[i] !== null));
    let end = ok.lastIndexOf(true);
    if (end < 0) return [];
    let start = end;
    while (start > 0 && ok[start - 1]) start--;
    return [start, end];
  },
  summary(r, months, varLevel) {
    if (r.length < 24) return null;
    let w = 1, peak = 1, dd = 0, run = 0, under = 0;
    for (const x of r) {
      w *= 1 + x; peak = Math.max(peak, w);
      dd = Math.min(dd, w / peak - 1);
      run = w < peak ? run + 1 : 0; under = Math.max(under, run);
    }
    const cagr = w ** (12 / r.length) - 1, sorted = [...r].sort((a, b) => a - b);
    const x = (sorted.length - 1) * varLevel, lo = Math.floor(x);  // quantile lineare, come pandas
    const v = sorted[lo] + (sorted[Math.min(lo + 1, sorted.length - 1)] - sorted[lo]) * (x - lo), tail = r.filter(y => y <= v);
    return { start: months[0], final: w, cagr, dd, under, var: v, es: tail.reduce((a, b) => a + b, 0) / tail.length,
             retDd: dd < 0 ? cagr / -dd : null };
  },
  scenario(r, months, a, b) {
    const i0 = months.indexOf(a), i1 = months.indexOf(b);
    if (i0 < 0 || i1 < 0) return null;
    const w = r.slice(i0, i1 + 1);
    if (w.some(x => x === null)) return null;
    let v = 1, peak = 1, dd = 0;
    for (const x of w) { v *= 1 + x; peak = Math.max(peak, v); dd = Math.min(dd, v / peak - 1); }
    return [v - 1, dd];
  },
  recovery(r, months, a, b) {
    const i0 = months.indexOf(a);
    const idx = [], wealth = [];
    let v = 1;
    for (let i = Math.max(i0, 0); i < r.length; i++) if (r[i] !== null) { v *= 1 + r[i]; wealth.push(v); idx.push(months[i]); }
    const nCrisis = idx.filter(m => m <= b).length;
    if (!nCrisis) return 0;
    const crisis = wealth.slice(0, nCrisis), low = Math.min(...crisis);
    if (low >= 1) return 0;
    const iLow = crisis.indexOf(low);
    for (let i = iLow; i < wealth.length; i++) if (wealth[i] >= 1) return i + 1;
    return null;
  },
  random() {
    let seed = 0;
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },
  quantile(sorted, fraction) {
    const x = (sorted.length - 1) * fraction, lo = Math.floor(x);
    return sorted[lo] + (sorted[Math.min(lo + 1, sorted.length - 1)] - sorted[lo]) * (x - lo);
  },
  monteCarlo(r, mc) {  // ricampiona i mesi storici; generatore con seme fisso, la banda non cambia a ogni modifica
    r = r.filter(x => x !== null);
    if (r.length < 60) return null;
    const rand = this.random();
    const finals = new Float64Array(mc.runs);
    for (let k = 0; k < mc.runs; k++) {
      let v = 100;
      for (let j = 0; j < mc.years * 12; j++) v *= 1 + r[Math.floor(rand() * r.length)];
      finals[k] = v;
    }
    finals.sort();
    const pct = p => this.quantile(finals, p / 100);
    return { 5: pct(5), 50: pct(50), 95: pct(95) };
  },
};

// Testi uguali a lab_html e stress_html di src/ui/cards.py
function labHtml(plain, trend, unit) {
  const cols = [["Senza filtro", plain], ...(trend ? [["Con filtro di tendenza", trend]] : [])];
  const rows = [["Oggi avresti", x => `${money(10000 * x.final)} ${unit}`], ["Guadagno medio all'anno", x => pctIt(x.cagr, 1)],
    ["Calo peggiore", x => pctIt(x.dd)], ["Attesa più lunga per tornare in pari", x => x.under === 0 ? "mai sotto" : monthsIt(x.under)],
    ["Mese cattivo, 1 su 20 (VaR 95%)", x => pctIt(x.var, 1)], ["Media dei mesi peggiori (Expected Shortfall)", x => pctIt(x.es, 1)],
    ["Guadagno annuo diviso calo peggiore", x => x.retDd === null ? "nessun calo" : x.retDd.toFixed(2).replace(".", ",")]];
  let verdict = "";
  if (trend) {
    const diff = (trend.cagr - plain.cagr) * 100;
    verdict = `<p>Il filtro ha reso <b>${Math.abs(diff).toFixed(1).replace(".", ",")} punti l'anno ${diff >= 0 ? "in più" : "in meno"}</b>`
      + ` e ha portato il calo peggiore da <b class="mono">${pctIt(plain.dd)}</b> a <b class="mono">${pctIt(trend.dd)}</b>.</p>`;
  }
  return `<div class="si card"><div class="head"><h3>Come sarebbe andata</h3><span class="note">da ${monthIt(plain.start, true)} a oggi</span></div>`
    + `<p>Se a ${monthIt(plain.start)} avessi messo <b>10.000 ${unit}</b> nel portafoglio qui a fianco:</p>`
    + `<div class="tbl"><table class="mtx"><tr><th></th>${cols.map(([n]) => `<th>${n}</th>`).join("")}</tr>`
    + rows.map(([label, f]) => `<tr><td>${label}</td>${cols.map(([, x]) => `<td>${f(x)}</td>`).join("")}</tr>`).join("") + `</table></div>${verdict}`
    + `<p class="note">Calo peggiore = quanto sei sceso, al massimo, da un picco. Attesa più lunga = il periodo più lungo passato `
    + `sotto un picco prima di superarlo. VaR = il mese peggiore 1 volta su 20; Expected Shortfall = quanto perdi in media in `
    + `quei mesi, dice meglio il rischio di eventi estremi. Guadagno diviso calo: più alto = più guadagno per ogni punto di calo. `
    + `Il grafico sotto segue 100 ${unit} nel tempo. Ribilanciamento ogni mese, ETF in dollari`
    + (unit === "€" ? ", convertiti in euro senza copertura del cambio" : "")
    + `, senza costi né tasse; il filtro sposta in cash (BIL, T-bill a 1-3 mesi) ogni ETF sotto la sua media a 10 mesi.</p></div>`;
}

function stressHtml(rows, mc, years, skipped, unit) {
  const back = n => n === null ? "non ancora in pari" : n === 0 ? "mai sotto la partenza" : `in pari dopo ${monthsIt(n)}`;
  const cell = (x, bold) => !x ? '<td class="n">nessun dato</td>'
    : `<td${bold ? ` style="color:var(--${x[0] >= 0 ? "r-gold" : "r-stag"})"` : ""}>${pctIt(x[0])}<br><span class="muted" style="font-size:11px">${back(x[2])}</span></td>`;
  const body = rows.map(([name, period, p, t, s]) => `<tr><td>${esc(name)}<br><span class="muted" style="font-size:12px">${esc(period)}</span></td>${cell(p, true)}${cell(t, true)}${cell(s)}</tr>`).join("");
  let worst = null;
  for (const [name, , p, t] of rows) if (p && t && (!worst || p[0] < worst[1][0])) worst = [name, p, t];
  const ex = worst ? `<p>Esempio, ${esc(worst[0].toLowerCase())}: con 10.000 ${unit} saresti arrivato a <b class="mono">${money(10000 * (1 + worst[1][0]))} ${unit}</b> `
    + `senza filtro e a <b class="mono">${money(10000 * (1 + worst[2][0]))} ${unit}</b> con il filtro.</p>` : "";
  const band = mc ? `<p>Guardando avanti, fra ${years} anni 100 ${unit} potrebbero diventare circa <b class="mono">${mc[50].toFixed(0)}</b>: `
    + `<b class="mono">${mc[5].toFixed(0)}</b> se va molto male, <b class="mono">${mc[95].toFixed(0)}</b> se va molto bene.</p>` : "";
  const note = skipped.length ? ` Esclusi perché senza ETF: ${esc(skipped.join(", "))}.` : "";
  return `<div class="si card"><div class="head"><h3>Grandi crolli</h3><span class="note">cosa sarebbe successo ai tuoi soldi</span></div>`
    + `<p>Le ${rows.length} grandi discese della borsa dal 2007. Per ognuna: <b>quanto avresti perso o guadagnato</b> (sopra) e <b>dopo quanto `
    + `tempo saresti tornato alla cifra di partenza</b> (sotto).</p>`
    + `<div class="tbl"><table class="mtx"><tr><th></th><th>Il tuo portafoglio</th><th>Con filtro di tendenza</th><th>Solo borsa USA</th></tr>${body}</table></div>${ex}${band}`
    + `<p class="note">Con filtro di tendenza = vendi ciò che scende sotto la sua media a 10 mesi e lo ricompri quando torna sopra: `
    + `aiuta nei crolli lunghi, nei rimbalzi veloci ti fa ricomprare tardi. Solo borsa USA = tutto nell'S&amp;P 500. `
    + `Nessun dato = qualche fondo non esisteva ancora. Ogni classe usa il suo ETF (azionario = SPY, growth = IWF, `
    + `value = IWD, difensivo = XLP, credito = LQD, dollaro = UUP, cash = BIL), ribilanciamento mensile, niente costi. La stima a 10 anni rimescola i mesi passati del portafoglio: `
    + `il passato non garantisce il futuro.${note}</p></div>`;
}

const lab = {
  profile: null, rows: [],
  update(s) {
    const S = DATA.stress;
    const changed = s.risk !== this.profile;
    if (changed) {  // come st.data_editor: cambiando profilo si riparte dai suoi pesi
      this.profile = s.risk;
      this.rows = Object.entries(S.bases[s.risk]).map(([a, w]) => ({ asset: a, w }));
    }
    const ccy = ["Dollari", "Euro"].includes(params().get("valuta")) ? params().get("valuta") : "Dollari";
    if (!$("#lab .edit")) this.skeleton(); else if (changed) this.table(); else if (ccy === this.ccy) return;
    this.ccy = ccy;
    $$("#labCcy button").forEach(b => b.classList.toggle("on", b.dataset.value === ccy));
    this.compute();
  },
  skeleton() {
    const S = DATA.stress;
    $("#lab").innerHTML = `<div class="cols" style="grid-template-columns:minmax(0,5fr) minmax(0,7fr)"><div class="box">
      <b>Le tue posizioni</b><table class="edit"><thead><tr><th>Asset</th><th>Peso %</th><th></th></tr></thead><tbody></tbody></table>
      <button type="button" class="btn" id="labAdd">+ Aggiungi riga</button>
      <p class="cap">Parte dall'allocazione qui sopra senza filtro: cambia pesi o aggiungi righe. I pesi si riportano a 100. Il filtro si confronta nel backtest.</p>
      <p class="lbl">Valuta dei risultati</p><div class="seg" id="labCcy"><button type="button" data-value="Dollari">Dollari</button><button type="button" data-value="Euro">Euro</button></div>
      <p class="cap">Euro = per chi investe dall'Italia in ETF in dollari senza copertura del cambio (cambio EUR/USD, prima del 1999 il marco). Segnali e filtro restano calcolati in dollari.</p>
      </div><div id="labOut"></div></div><div id="labStress"></div>`;
    $("#labAdd").onclick = () => { this.rows.push({ asset: S.assets[0], w: 0 }); this.table(); this.compute(); };
    $("#labCcy").onclick = e => { const b = e.target.closest("button"); if (b) { const p = params(); p.set("valuta", b.dataset.value); history.replaceState(null, "", "?" + p); this.update(state($("#page"))); } };
    $("#lab tbody").addEventListener("input", e => {
      const i = +e.target.closest("tr").dataset.i;
      if (e.target.tagName === "SELECT") this.rows[i].asset = e.target.value;
      else this.rows[i].w = e.target.value === "" ? null : Math.min(100, Math.max(0, +e.target.value));
      this.compute();
    });
    $("#lab tbody").addEventListener("click", e => {
      if (!e.target.matches("button")) return;
      this.rows.splice(+e.target.closest("tr").dataset.i, 1); this.table(); this.compute();
    });
    this.table();
  },
  table() {
    const S = DATA.stress;
    $("#lab tbody").innerHTML = this.rows.map((r, i) => `<tr data-i="${i}"><td><select aria-label="Asset">${S.assets.map(a => `<option${a === r.asset ? " selected" : ""}>${esc(a)}</option>`).join("")}</select></td>`
      + `<td><input type="number" min="0" max="100" step="1" aria-label="Peso %" value="${r.w ?? ""}"></td><td><button type="button" aria-label="Togli riga">✕</button></td></tr>`).join("");
  },
  compute() {
    const S = DATA.stress, out = $("#labOut"), st = $("#labStress");
    const grouped = {};  // come groupby("Asset"): asset in ordine alfabetico, pesi sommati, righe vuote ignorate
    for (const r of this.rows) if (r.asset && r.w !== null && !isNaN(r.w)) grouped[r.asset] = (grouped[r.asset] || 0) + r.w;
    const sorted = Object.fromEntries(Object.keys(grouped).sort().map(k => [k, grouped[k]]));
    const [tw, skipped] = stress.tickerWeights(sorted, S.proxy);
    if (!Object.keys(tw).length) { out.innerHTML = '<p class="notice">Inserisci almeno una posizione con un ETF di riferimento.</p>'; st.innerHTML = ""; return; }
    let r = stress.portfolio(tw, S), rt = stress.trend(tw, S), spy = stress.ret(S.px.SPY), unit = "$";
    if (this.ccy === "Euro") [r, rt, spy, unit] = [stress.eur(r, S.usd_per_eur), stress.eur(rt, S.usd_per_eur), stress.eur(spy, S.usd_per_eur), "€"];
    let cw = stress.commonWindow(r, rt);
    const slice = (x, w) => w.length ? x.slice(w[0], w[1] + 1) : [];
    let plain = stress.summary(slice(r, cw), slice(S.months, cw), S.var_level), filtered = stress.summary(slice(rt, cw), slice(S.months, cw), S.var_level);
    if (!plain) {  // il filtro non ha un tratto abbastanza lungo (manca BIL): solo il portafoglio
      cw = stress.commonWindow(r);
      plain = stress.summary(slice(r, cw), slice(S.months, cw), S.var_level); filtered = null;
    }
    out.innerHTML = "";
    if (plain) {
      const curve = x => { let v = 100; return slice(x, cw).map((y, i) => [slice(S.months, cw)[i] + "-01", +(v *= 1 + y).toFixed(2)]); };
      const series = [{ label: "Senza filtro", tok: "r-defl", data: curve(r) }, ...(filtered ? [{ label: "Con filtro", tok: "r-refl", data: curve(rt) }] : [])];
      out.innerHTML = labHtml(plain, filtered, unit) + '<div class="si" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">'
        + series.map(s => `<span class="chip"><i class="dot" style="background:var(--${s.tok})"></i>${s.label}</span>`).join("") + '</div><div class="lwc"></div>';
      lineChart($(".lwc", out), { height: 240, series });
    }
    const crisis = (x, a, b) => { const sc = stress.scenario(x, S.months, a, b); return sc ? [...sc, stress.recovery(x, S.months, a, b)] : null; };
    const rows = S.scenarios.map(([name, period, a, b]) => [name, period, crisis(r, a, b), crisis(rt, a, b), crisis(spy, a, b)]);
    st.innerHTML = stressHtml(rows, stress.monteCarlo(r, S.mc), S.mc.years, skipped, unit)
      + S.ucits.head + Object.keys(tw).map(t => S.ucits.rows[t] || "").join("") + S.ucits.tail;
  },
};

const advice = {
  root: null,
  categories: ["Conto e depositi", "Risparmio gestito", "Titoli", "Polizze", "Altro"],
  portfolios() { return ["current", "proposed"].map(id => $("#advice-" + id, this.root)); },
  init() {
    const [current, proposed] = this.portfolios();
    this.add(current);
    $("#advice-add-current", this.root).onclick = () => { this.add(current); this.invalidate(); };
    $("#advice-add-proposed", this.root).onclick = () => { this.add(proposed); this.invalidate(); };
    $("#advice-copy", this.root).onclick = event => {
      const rows = this.read(current);
      if (!rows?.length) {
        $("#advice-result", this.root).textContent = "Completa almeno una posizione con un importo valido.";
        return;
      }
      proposed.replaceChildren();
      rows.forEach(row => this.add(proposed, row));
      proposed.hidden = false;
      $("#advice-empty", this.root).hidden = true;
      $("#advice-add-proposed", this.root).hidden = false;
      event.currentTarget.hidden = true;
      this.invalidate();
    };
    this.root.addEventListener("input", () => this.invalidate());
    $("#advice-run", this.root).onclick = () => this.run();
    $("#advice-reset", this.root).onclick = event => {
      proposed.replaceChildren();
      proposed.hidden = true;
      $("#advice-empty", this.root).hidden = false;
      $("#advice-add-proposed", this.root).hidden = true;
      $("#advice-copy", this.root).hidden = false;
      event.currentTarget.hidden = true;
      this.invalidate();
    };
    this.invalidate();
  },
  add(container, row = { category: this.categories[0], amount: null, reference: "fixed", cost: 0, available: false }) {
    const position = document.createElement("div");
    position.className = "advice-position";
    const references = Object.keys(DATA?.stress?.proxy ?? {}).filter(name => name !== "Cash");
    const euro = Object.entries(DATA?.stress?.refs ?? {});
    position.innerHTML = `<label>Categoria <select data-field="category">${this.categories.map(name =>
      `<option>${esc(name)}</option>`).join("")}</select></label>
      <label>Valore in euro <input data-field="amount" type="number" min="0" max="1000000000000" step=".01"></label>
      <label class="advice-reference">Modello per la simulazione <select data-field="reference">
        <option value="">Da approfondire</option><option value="fixed">Liquidità a valore costante</option>
        ${euro.length ? `<optgroup label="Riferimenti in euro">${euro.map(([name, ref]) =>
          `<option value="${esc(name)}">${esc(name)} (${esc(ref.label)})</option>`).join("")}</optgroup>` : ""}
        <optgroup label="ETF in dollari">${references.map(name => `<option value="${esc(name)}">${esc(name)} (${esc(DATA.stress.proxy[name])})</option>`).join("")}</optgroup>
      </select></label>
      <label>Costi annui in % <input data-field="cost" type="number" min="0" max="10" step=".01"></label>
      <label class="toggle"><input data-field="available" type="checkbox"> Disponibile per la spesa</label>
      <button type="button" class="btn">Rimuovi</button>`;
    for (const key of ["category", "reference"]) {
      $(`[data-field=${key}]`, position).value = row[key] ?? "";
    }
    $("[data-field=amount]", position).value = row.amount === null ? "" : row.amount / 100;
    $("[data-field=cost]", position).value = row.cost ? row.cost * 100 : "";
    $("[data-field=available]", position).checked = row.available;
    $("[data-field=category]", position).addEventListener("change", event => {
      $("[data-field=reference]", position).value = event.target.value === this.categories[0] ? "fixed" : "";
    });
    $("button", position).onclick = () => {
      position.remove();
      this.invalidate();
    };
    container.append(position);
  },
  read(container) {
    const rows = [];
    for (const position of $$(".advice-position", container)) {
      const field = key => $(`[data-field=${key}]`, position);
      const amount = field("amount"), cost = field("cost");
      if (!amount.validity.valid || !cost.validity.valid) return null;
      if (!amount.value || amount.valueAsNumber === 0) continue;
      rows.push({
        category: field("category").value,
        reference: field("reference").value,
        amount: Math.round(amount.valueAsNumber * 100),
        cost: cost.value ? cost.valueAsNumber / 100 : 0,
        available: field("available").checked,
      });
    }
    return rows;
  },
  invalidate() {
    const [current, proposed] = this.portfolios();
    for (const [container, id] of [[current, "current"], [proposed, "proposed"]]) {
      const rows = this.read(container);
      $("#advice-total-" + id, this.root).textContent = rows
        ? "Totale inserito " + this.euros(this.total(rows)) : "Verifica gli importi.";
    }
    if (this.root.querySelector(".client-overview")) updateClientOverview(this.root, this.read(current));
    $("#advice-reset", this.root).hidden = proposed.hidden;
    $("#advice-result", this.root).textContent = "Calcola per aggiornare il confronto.";
  },
  total(rows) { return rows.reduce((sum, row) => sum + row.amount, 0); },
  euros(cents) { return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(cents / 100); },
  goal() {
    if ($("#monthly-saving",this.root)) return {};
    const amount = $("#advice-goal", this.root), date = $("#advice-date", this.root);
    if (!amount.value && !date.value && amount.validity.valid && date.validity.valid) return {};
    if (!amount.validity.valid || !date.validity.valid || !(amount.valueAsNumber > 0) || !date.value) {
      return { error: "Indica sia l’importo positivo sia il mese previsto per la spesa." };
    }
    const now = new Date(), [year, month] = date.value.split("-").map(Number);
    const months = (year - now.getFullYear()) * 12 + month - now.getMonth() - 1;
    if (months < 0 || months > 120) return { error: "Scegli un mese tra quello corrente e i prossimi dieci anni." };
    return { amount: Math.round(amount.valueAsNumber * 100), months };
  },
  model(rows, S) {
    const modeled = rows.filter(row => row.reference === "fixed" || S?.refs?.[row.reference] || S?.px?.[S.proxy[row.reference]]);
    const eligible = modeled.filter(row => row.available);
    const unknownEligible = rows.some(row => row.available && !modeled.includes(row));
    const group = positions => {
      const start = this.total(positions);
      const columns = positions.map(row => {
        const gross = row.reference === "fixed" ? Array(S?.months.length ?? 1).fill(0)
          : S.refs?.[row.reference]?.r ?? stress.eur(stress.ret(S.px[S.proxy[row.reference]]), S.usd_per_eur);
        const keep = (1 - row.cost) ** (1 / 12);  // costo annuo tolto ogni mese
        return gross.map(r => r === null ? null : (1 + r) * keep - 1);
      });
      return { start, returns: start ? stress.combine(positions.map(row => row.amount / start), columns) : null };
    };
    return {
      total: this.total(rows), eligible: group(eligible), other: group(modeled.filter(row => !row.available)),
      modeled: this.total(modeled), unknownEligible, eligibleTotal: this.total(rows.filter(row => row.available)),
      risky: modeled.some(row => row.reference !== "fixed"),
    };
  },
  simulate(models, goal, horizon, runs) {
    const sides = models.map(({ eligible, other }) => ({ eligible, other,
      values: Array.from({ length: horizon + 1 }, () => new Float64Array(runs)),
      goalValues: goal.amount ? new Float64Array(runs) : null, misses: 0 }));
    const returns = sides.flatMap(({ eligible, other }) => [eligible.returns, other.returns]).filter(Boolean);
    if (!returns.length) return null;
    const window = stress.commonWindow(...returns);
    const risky = models.some(model => model.risky);
    if (!window.length || (risky && window[1] - window[0] + 1 < 60)) return null;
    const [start, end] = window, random = stress.random();
    const wealth = sides.map(() => ({ eligible: 0, other: 0 }));
    for (let k = 0; k < runs; k++) {
      sides.forEach((side, i) => {
        wealth[i].eligible = side.eligible.start;
        wealth[i].other = side.other.start;
      });
      for (let month = 0; month <= horizon; month++) {
        const index = month ? start + Math.floor(random() * (end - start + 1)) : start;
        sides.forEach((side, i) => {
          const w = wealth[i];
          if (month) {
            w.eligible *= 1 + (side.eligible.returns?.[index] ?? 0);
            w.other *= 1 + (side.other.returns?.[index] ?? 0);
          }
          if (month === goal.months) {
            side.goalValues[k] = w.eligible;
            if (w.eligible + 0.000001 < goal.amount) side.misses++;
          }
          side.values[month][k] = w.eligible + w.other;
        });
      }
    }
    return {
      series: sides.map(({ values, goalValues, misses }) => ({
        misses: misses / runs,
        goalLow: goalValues ? stress.quantile(goalValues.sort(), .05) : null,
        bands: values.map(column => {
          column.sort();
          return [.05, .5, .95].map(p => stress.quantile(column, p));
        }),
      })),
      history: risky ? [start, end] : null,
    };
  },
  plot(series, horizon, goalMonth) {
    const width = 760, height = 285, left = 105, right = 714, top = 18, bottom = 246;
    const values = series.flatMap(({ bands }) => bands.flat());
    const min = Math.min(...values), max = Math.max(...values);
    const pad = Math.max((max - min) * .05, max * .005, 1);
    const low = Math.max(0, min - pad), high = max + pad;
    const x = month => left + (right - left) * month / horizon;
    const y = value => bottom - (bottom - top) * (value - low) / (high - low);
    const points = (bands, i) => bands.map((row, month) => `${x(month).toFixed(1)},${y(row[i]).toFixed(1)}`);
    const tokens = ["--r-defl", "--accent"];
    const grid = Array.from({ length: 5 }, (_, i) => {
      const value = low + (high - low) * i / 4, at = y(value);
      return `<path d="M${left},${at}H${right}" stroke="var(--line)"/>
        <text x="${left - 8}" y="${at + 4}" text-anchor="end">${this.euros(value)}</text>`;
    }).join("");
    const ticks = [...new Set([0, Math.round(horizon / 3), Math.round(horizon * 2 / 3), horizon])].map(month =>
      `<text x="${x(month)}" y="267" text-anchor="middle">${month ? monthsIt(month) : "Oggi"}</text>`).join("");
    const marker = goalMonth === undefined ? "" : `<path d="M${x(goalMonth)},${top}V${bottom}"
      stroke="var(--muted)" stroke-dasharray="4 4"><title>Mese della spesa</title></path>`;
    const shapes = series.map(({ bands }, i) => `<polygon fill="var(${tokens[i]})" opacity=".14"
      points="${[...points(bands, 0), ...points(bands, 2).reverse()].join(" ")}"/>`).join("")
      + series.map(({ bands }, i) => `<polyline fill="none" stroke="var(${tokens[i]})" stroke-width="2.5"
      ${i ? 'stroke-dasharray="6 4"' : ""} points="${points(bands, 1).join(" ")}"/>`).join("");
    return `<svg class="advice-plot" viewBox="0 0 ${width} ${height}" role="img"
      aria-label="Valore simulato nel tempo. Fascia dal quinto al novantacinquesimo percentile e mediana."
      fill="var(--muted)" font-size="13">${grid}${ticks}${marker}<g class="mc-data">${shapes}</g></svg>
      <div class="advice-key"><span style="--key:var(--r-defl)">Situazione attuale</span>
        ${series.length > 1 ? '<span style="--key:var(--accent)">Proposta (linea tratteggiata)</span>' : ""}</div>`;
  },
  run() {
    const result = $("#advice-result", this.root), [current, proposed] = this.portfolios();
    const rows = [this.read(current), ...(!proposed.hidden ? [this.read(proposed)] : [])];
    const goal = this.goal();
    if (rows.some(row => row === null) || !rows[0]?.length || goal.error) {
      result.textContent = goal.error ?? "Inserisci almeno una posizione attuale e verifica gli importi.";
      return;
    }
    const S = DATA?.stress, models = rows.map(row => this.model(row, S));
    const labels = ["Situazione attuale", "Proposta"];
    const summaries = models.map((model, i) => {
      const breakdown = this.categories.map(category => {
        const amount = this.total(rows[i].filter(row => row.category === category));
        return amount ? `<div>${category} · ${this.euros(amount)}</div>` : "";
      }).join("");
      return `<div class="metric"><span class="v">${labels[i]} · ${this.euros(model.total)}</span>
        ${breakdown}<span class="k">Patrimonio simulabile ${this.euros(model.modeled)}</span>
        ${goal.amount ? `<span class="k">Segnato come disponibile per la spesa ${this.euros(model.eligibleTotal)}</span>` : ""}
        ${model.modeled < model.total ? `<span class="k">Da approfondire ${this.euros(model.total - model.modeled)}</span>` : ""}</div>`;
    }).join("");
    result.innerHTML = '<div class="metrics">' + summaries + '</div>';
    if (models.length === 2 && models[0].total !== models[1].total) {
      const difference = models[1].total - models[0].total;
      const exact = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(Math.abs(difference) / 100);
      result.insertAdjacentHTML("beforeend", `<p class="notice warn">La proposta ha ${exact} in ${difference > 0 ? "più" : "meno"}. Pareggia i due totali per confrontarli.</p>`);
      return;
    }
    if (models.some(model => !model.modeled)) {
      result.insertAdjacentHTML("beforeend", '<p class="notice warn">Associa almeno una posizione per portafoglio a un modello per avviare la simulazione.</p>');
      return;
    }
    const horizon = goal.months === undefined ? 120 : Math.max(goal.months, 12);
    const runs = S?.mc?.runs ?? 2000;
    const sim = this.simulate(models, goal, horizon, runs);
    if (!sim) {
      result.insertAdjacentHTML("beforeend", '<p class="notice warn">Servono almeno 60 mesi consecutivi di dati comuni per le posizioni simulate.</p>');
      return;
    }
    const measures = sim.series.map(({ misses, bands, goalLow }, i) => {
      const model = models[i], [low, median, high] = bands[goal.months ?? horizon];
      const rate = new Intl.NumberFormat("it-IT", { style: "percent", maximumFractionDigits: 1 }).format(misses);
      return `<div class="metric"><span class="v">${labels[i]}</span>
        <span>Valore mediano ${this.euros(median)}</span>
        <span class="k">5°–95° percentile · ${this.euros(low)} – ${this.euros(high)}</span>
        ${goal.amount ? `<span>Spesa scoperta nelle simulazioni: ${rate}</span>
          <span class="k">Capitale disponibile al 5° percentile · ${this.euros(goalLow)}</span>
          ${model.unknownEligible ? '<span class="k">Stima parziale: alcune posizioni segnate come disponibili sono fuori dal modello.</span>' : ""}
          ${!model.eligibleTotal ? '<span class="k">Nessuna posizione segnata come disponibile per la spesa.</span>' : ""}` : ""}</div>`;
    }).join("");
    const prompts = [];
    if (models.some(model => model.modeled !== model.total)) {
      prompts.push("Verifica esposizioni, valore di riscatto e vincoli delle voci fuori simulazione prima di trarre conclusioni sull’intero patrimonio.");
    }
    if (goal.amount && models.some(model => model.eligibleTotal < goal.amount)) {
      prompts.push("Controlla se la spesa può essere coperta con altre somme. Almeno uno degli assetti ha oggi meno capitale segnato come disponibile dell’importo indicato.");
    }
    if (models.length === 2 && goal.amount && models.every(model => !model.unknownEligible) && sim.series[1].misses > sim.series[0].misses) {
      prompts.push("Nel modello la proposta lascia scoperta la spesa più spesso. Prova a riservare una quota liquida maggiore e confronta di nuovo.");
    }
    if (models.length === 2 && models[0].modeled !== models[1].modeled) {
      prompts.push("I grafici partono da importi simulabili diversi. Allinea la copertura prima di confrontare i valori finali.");
    }
    if (models.length === 2 && models.every(model => model.modeled === model.total) &&
        sim.series[1].bands[goal.months ?? horizon][0] < sim.series[0].bands[goal.months ?? horizon][0]) {
      prompts.push("Nella proposta il valore al 5° percentile è più basso. Verifica se il cliente potrebbe sostenere quell’esito all’orizzonte scelto.");
    }
    const heading = goal.amount ? "Valori al mese della spesa" : "Valori dopo 10 anni";
    const history = sim.history ? ` Campione storico comune da ${S.months[sim.history[0]]} a ${S.months[sim.history[1]]}.` : "";
    queueMicrotask(() => drawPlot(result));
    result.insertAdjacentHTML("beforeend", `<h3>Monte Carlo sul patrimonio simulabile</h3>
      ${this.plot(sim.series, horizon, goal.months)}<h3>${heading}</h3><div class="metrics">${measures}</div>
      ${prompts.length ? `<h3>Cosa approfondire</h3><ul>${prompts.map(note => `<li>${note}</li>`).join("")}</ul>` : ""}
      <p class="cap">${sim.history ? `${runs.toLocaleString("it-IT")} percorsi con gli stessi mesi estratti per ogni portafoglio.${history}`
        : "Le voci simulate hanno valore costante in ogni percorso."}
      Fasce dal 5° al 95° percentile a ogni data. Valori nominali in euro prima delle tasse, al netto dei soli costi annui indicati per ogni posizione. Liquidità a rendimento zero.
      Riferimenti in euro: azioni mondo da ETF quotati in dollari convertiti in euro, obbligazioni e liquidità area euro ricostruite dal decennale e dal tasso a 3 mesi.
      Per le posizioni modellate tramite ETF in dollari, rendimenti storici convertiti in euro e pesi costanti mese per mese all’interno delle due quote, disponibile e restante.
      ${goal.amount ? "La spesa è verificata al mese indicato senza sottrarla dai percorsi." : "La simulazione considera il capitale iniziale senza versamenti successivi."} Le percentuali valgono per queste ipotesi.</p>`);
  },
};

function renderAdvice(page) {
  if (!advice.root) {
    advice.root = $("#advice").content.firstElementChild.cloneNode(true);
    advice.init();
  }
  page.replaceChildren(advice.root);
  const target = $("#advice-market", page);
  const context = DATA?.advice_market;
  if (!context?.length) {
    target.innerHTML = DATA
      ? '<p>Apri Mondo per consultare le letture disponibili.</p>'
      : '<p>I dati di mercato sono temporaneamente indisponibili. Puoi continuare a preparare il colloquio.</p>';
    return;
  }
  target.innerHTML = '<div class="metrics">' + context.map(({ area, regime, phase, macro_month, trend, trend_month, yield_10y, yield_month }) => {
    const reading = trend === true ? "positiva" : trend === false ? "negativa" : "non disponibile";
    return `<div class="metric">
      <a class="v" href="/paese?area=${encodeURIComponent(area)}">${esc(area)}</a>
      <span class="d">${esc(regime)} · ${esc(phase || "Fase non disponibile")}${macro_month ? " · " + esc(macro_month) : ""}</span>
      <span class="k">Tendenza azionaria ${reading}${trend_month ? " · " + esc(trend_month) : ""}</span>
      <span class="k">Decennale ${yield_10y ? esc(yield_10y) + " · " + esc(yield_month) : "non disponibile"}</span>
    </div>`;
  }).join("") + '</div>';
}

function route() {
  const {section, view} = currentView();
  const overview = section === "panoramica" && !view;
  if (overview) applyOverviewTheme();
  else delete document.documentElement.dataset.overviewTheme;
  $("#logo").nextElementSibling.textContent = (overview || view === "calendario") ? "Macro Cycle Tracker" : "Soft Investing";
  setLogo();
  renderNav(section, view);
  document.title = MAIN.find(([k]) => k === section)[1] + " · Soft Investing";
  const page = $("#page");
  if (!view && section === "strumento") return marketPage(page, section);
  if (section === "clienti") return clientPage(page);
  if (!view && section === "consulenza") { renderAdvice(page); meetingTools(page); }
  else if (overview) return renderOverview(page);
  else if (section === "panoramica" && view === "oggi") {
    marketPage(page, section);
    if (DATA?.pages.oggi) page.insertAdjacentHTML("beforeend", DATA.pages.oggi);
  }
  else if (DATA) {
    page.innerHTML = DATA.pages[view];
    if (view === "paese") page.insertAdjacentHTML("afterbegin", '<p class="note">Il regime combina la variazione della crescita annua del PIL rispetto al trimestre precedente e quella dell’inflazione degli ultimi tre mesi rispetto ai tre precedenti.</p>');
  }
  else {
    page.innerHTML = '<p class="notice warn">Dati di mercato non disponibili. Riprova fra qualche minuto.</p>';
    return;
  }
  lab.profile = null;
  applyFilters(page);
  applyState(page);
  runScripts(page);
  heroVideo(page);
  reveal(page);
  if (location.hash) $(location.hash)?.scrollIntoView();
}

function freshness() {
  if (!DATA.updated_at) return;
  const t = new Date(DATA.updated_at);
  const fresh = Date.now() - t < 48 * 3600e3;  // un run al giorno, nessuno il sabato
  const f = new Intl.DateTimeFormat("it-IT", { timeZone: "Europe/Rome", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }).formatToParts(t);
  const p = Object.fromEntries(f.map(x => [x.type, x.value]));
  $("#fresh").innerHTML = `<i style="background:var(--${fresh ? "r-gold" : "r-refl"})"></i>Dati aggiornati il ${p.day}/${p.month} alle ${p.hour}:${p.minute}`;
}

async function load() {
  await loadPrivateFunds();
  setLogo();
  try {
    const res = await fetch("/data/site.json", { cache: "no-cache", signal: AbortSignal.timeout(20000) });
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
  } catch {
    route();
    return;
  }
  const style = document.createElement("style");
  style.textContent = DATA.css;
  document.head.append(style);
  $("#warnings").innerHTML = DATA.warnings;
  freshness();
  route();
}
dark.addEventListener("change", () => { setLogo(); if (DATA) route(); });  // i grafici leggono i colori del tema
load();
</script>
